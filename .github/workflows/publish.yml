name: Publish package

on:
  push:
    tags: ["*"]

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    name: Publish WASM package to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Set up GitHub Packages authentication
        run: |
          cat <<EOF > .npmrc
          @rilevera:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          EOF
      - name: Build, test, and publish package
        run: make publish
